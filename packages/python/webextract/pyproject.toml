[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "webextract-sdk"
version = "0.1.1"
description = "Thin client for the WebExtract API: web page to clean Markdown + fixed-schema JSON for AI agents. Prepaid key, free tier, or pay per call with x402."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "TAINCHENG, L.L.C." }]
keywords = ["webextract", "web-scraping", "markdown", "extraction", "ai-agents", "llm", "x402", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
x402 = ["x402[evm,httpx]>=2.25,<3"]

[project.urls]
Homepage = "https://webextract.dev"
Documentation = "https://webextract.dev/docs"
Source = "https://github.com/nyx464664816-stack/webextract"
Issues = "https://github.com/nyx464664816-stack/webextract/issues"

[tool.hatch.build.targets.sdist]
include = ["src/webextract", "tests/*.py", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/webextract"]
