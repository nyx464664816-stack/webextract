name: status-page
on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub may delay scheduled runs at busy times
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: status-page
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch previous gh-pages output (keeps history)
        run: |
          mkdir -p site
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth 1 origin gh-pages
            git --work-tree=site checkout origin/gh-pages -- . || true
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe (read-only, no payments)
        run: python3 status/probe.py site
      - name: Publish to gh-pages
        run: |
          cd site
          echo "status.webextract.dev" > CNAME
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "status $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
